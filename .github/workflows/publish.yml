name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty to use csproj version)"
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = $null
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          }
          elseif ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
          }
          else {
            $csproj = Get-Content "src\ElBruno.FoundryLocalMonitor.Tool\ElBruno.FoundryLocalMonitor.Tool.csproj" -Raw
            if ($csproj -match '<Version>([^<]+)</Version>') {
              $version = $Matches[1]
            }
          }

          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+') {
            throw "Invalid version: '$version'"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "📦 Publishing version: $version"

      - name: Restore
        run: dotnet restore ElBruno.FoundryLocalMonitor.slnx

      - name: Build
        run: dotnet build ElBruno.FoundryLocalMonitor.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests\ElBruno.FoundryLocalMonitor.Tests\ElBruno.FoundryLocalMonitor.Tests.csproj -c Release --no-build --framework net10.0-windows --verbosity normal

      - name: Pack (Tool)
        run: dotnet pack src\ElBruno.FoundryLocalMonitor.Tool\ElBruno.FoundryLocalMonitor.Tool.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

name: Squad Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ElBruno.FoundryLocalMonitor.slnx

      - name: Build
        run: dotnet build ElBruno.FoundryLocalMonitor.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests\ElBruno.FoundryLocalMonitor.Tests\ElBruno.FoundryLocalMonitor.Tests.csproj -c Release --no-build --framework net10.0-windows --verbosity normal

      - name: Read version from .csproj
        id: version
        shell: pwsh
        run: |
          $csproj = Get-Content "src\ElBruno.FoundryLocalMonitor.Tool\ElBruno.FoundryLocalMonitor.Tool.csproj" -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') {
            throw "Version not found in tool csproj"
          }
          $version = $Matches[1]
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "📦 Version: $version (tag: v$version)"

      - name: Check if tag already exists
        id: check_tag
        shell: pwsh
        run: |
          git fetch --tags --force | Out-Null
          $tagExists = git tag -l "${{ steps.version.outputs.tag }}"
          if ($tagExists) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "⏭️ Tag ${{ steps.version.outputs.tag }} already exists — skipping release."
          }
          else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "🆕 Tag ${{ steps.version.outputs.tag }} does not exist — creating release."
          }

      - name: Create git tag
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes --latest

      - name: Verify release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}"
          echo "✅ Release ${{ steps.version.outputs.tag }} created and verified."

      - name: Trigger publish workflow
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml --ref main -f version=${{ steps.version.outputs.version }}
          echo "🚀 Triggered publish workflow for version ${{ steps.version.outputs.version }}"
